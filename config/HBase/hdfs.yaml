apiVersion: v1
kind: ConfigMap
metadata:
  name: hadoop-config
data:
  core-site.xml: |
    <?xml version="1.0"?>
    <configuration>
      <property>
        <name>fs.defaultFS</name>
        <value>hdfs://namenode:9000</value>
      </property>
    </configuration>
  hdfs-site.xml: |
    <?xml version="1.0"?>
    <configuration>
      <!-- demo: 1 DataNode, so 1 block replica -->
      <property>
        <name>dfs.replication</name>
        <value>1</value>
      </property>
      <property>
        <name>dfs.namenode.name.dir</name>
        <value>/data/namenode</value>
      </property>
      <property>
        <name>dfs.datanode.data.dir</name>
        <value>/data/datanode</value>
      </property>
      <!-- HDFS permissions disabled, as in the exercises -->
      <property>
        <name>dfs.permissions.enabled</name>
        <value>false</value>
      </property>
      <!-- pods have no fixed IPs -->
      <property>
        <name>dfs.namenode.datanode.registration.ip-hostname-check</name>
        <value>false</value>
      </property>
      <!-- NameNode listens on all pod interfaces, not on the fs.defaultFS address -->
      <property>
        <name>dfs.namenode.rpc-bind-host</name>
        <value>0.0.0.0</value>
      </property>
      <property>
        <name>dfs.namenode.http-bind-host</name>
        <value>0.0.0.0</value>
      </property>
    </configuration>
---
apiVersion: v1
kind: Service
metadata:
  name: namenode
spec:
  selector:
    app: namenode
  ports:
    - name: rpc
      port: 9000
    - name: web
      port: 9870
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: namenode
spec:
  serviceName: namenode
  replicas: 1
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain   # keep data after kubectl delete
    whenScaled: Retain
  selector:
    matchLabels:
      app: namenode
  template:
    metadata:
      labels:
        app: namenode
    spec:
      containers:
        - name: namenode
          image: apache/hadoop:3.3.6
          command:
            - bash
            - -c
            - |
              if [ ! -f /data/namenode/current/VERSION ]; then
                hdfs namenode -format -nonInteractive
              fi
              exec hdfs namenode
          env:
            - name: HADOOP_HEAPSIZE_MAX
              value: "1g"
          ports:
            - containerPort: 9000
            - containerPort: 9870
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              cpu: "1"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
              subPath: hdfs-site.xml
      volumes:
        - name: config
          configMap:
            name: hadoop-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 5Gi   # NameNode metadata (fsimage + edits)
---
apiVersion: v1
kind: Service
metadata:
  name: datanode
spec:
  clusterIP: None
  selector:
    app: datanode
  ports:
    - name: data
      port: 9866
    - name: web
      port: 9864
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: datanode
spec:
  serviceName: datanode
  replicas: 1   # demo; more DataNodes = raise dfs.replication
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain   # keep data after kubectl delete
    whenScaled: Retain
  selector:
    matchLabels:
      app: datanode
  template:
    metadata:
      labels:
        app: datanode
    spec:
      containers:
        - name: datanode
          image: apache/hadoop:3.3.6
          command: ["hdfs", "datanode"]
          env:
            - name: HADOOP_HEAPSIZE_MAX
              value: "1g"
          ports:
            - containerPort: 9866
            - containerPort: 9864
          resources:
            requests:
              cpu: 250m
              memory: 1536Mi
            limits:
              cpu: "2"
              memory: 1536Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/core-site.xml
              subPath: core-site.xml
            - name: config
              mountPath: /opt/hadoop/etc/hadoop/hdfs-site.xml
              subPath: hdfs-site.xml
      volumes:
        - name: config
          configMap:
            name: hadoop-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 200Gi   # all HBase data lives here, cant rescale without deleting data
