apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-cluster-config
data:
  # Keep this ID unchanged for the lifetime of the persistent volumes.
  cluster-id: hs3CLRFHQWycV52aYhMBsw
  server.properties: |
    process.roles=broker,controller
    listeners=PLAINTEXT://:9092,CONTROLLER://:9093
    listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    controller.listener.names=CONTROLLER
    log.dirs=/var/lib/kafka/data/kraft-combined-logs
    offsets.topic.replication.factor=3
    transaction.state.log.replication.factor=3
    transaction.state.log.min.isr=2
    default.replication.factor=3
    min.insync.replicas=2
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-cluster-kafka-brokers
spec:
  clusterIP: None
  # Controllers must resolve one another before any broker becomes ready.
  publishNotReadyAddresses: true
  selector:
    app: kafka-cluster-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
    - name: controller
      port: 9093
      targetPort: controller
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-cluster-kafka-bootstrap
spec:
  selector:
    app: kafka-cluster-kafka
  ports:
    - name: kafka
      port: 9092
      targetPort: kafka
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: kafka-cluster-kafka
spec:
  serviceName: kafka-cluster-kafka-brokers
  replicas: 3
  # Start all three controllers together so quorum formation cannot deadlock.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      app: kafka-cluster-kafka
  template:
    metadata:
      labels:
        app: kafka-cluster-kafka
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: kafka-cluster-kafka
      containers:
        - name: kafka
          image: apache/kafka:4.3.2
          command: ["/bin/bash", "-ec"]
          args:
            - |
              node_id="${POD_NAME##*-}"
              broker_dns="${POD_NAME}.kafka-cluster-kafka-brokers.${POD_NAMESPACE}.svc"
              cp /etc/kafka-config/server.properties /tmp/server.properties
              {
                echo "node.id=${node_id}"
                echo "advertised.listeners=PLAINTEXT://${broker_dns}:9092"
                echo "controller.quorum.voters=0@kafka-cluster-kafka-0.kafka-cluster-kafka-brokers.${POD_NAMESPACE}.svc:9093,1@kafka-cluster-kafka-1.kafka-cluster-kafka-brokers.${POD_NAMESPACE}.svc:9093,2@kafka-cluster-kafka-2.kafka-cluster-kafka-brokers.${POD_NAMESPACE}.svc:9093"
              } >> /tmp/server.properties
              /opt/kafka/bin/kafka-storage.sh format \
                --ignore-formatted \
                --cluster-id "$CLUSTER_ID" \
                --release-version 4.3-IV0 \
                --config /tmp/server.properties
              exec /opt/kafka/bin/kafka-server-start.sh /tmp/server.properties
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CLUSTER_ID
              valueFrom:
                configMapKeyRef:
                  name: kafka-cluster-config
                  key: cluster-id
            - name: KAFKA_HEAP_OPTS
              value: -Xms512m -Xmx1g
          ports:
            - name: kafka
              containerPort: 9092
            - name: controller
              containerPort: 9093
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 2Gi
          startupProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: kafka
            periodSeconds: 10
          volumeMounts:
            - name: config
              mountPath: /etc/kafka-config
              readOnly: true
            - name: data
              mountPath: /var/lib/kafka/data
      volumes:
        - name: config
          configMap:
            name: kafka-cluster-config
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 10Gi
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: kafka-cluster-kafka
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: kafka-cluster-kafka
